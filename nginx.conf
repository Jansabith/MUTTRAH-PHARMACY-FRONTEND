# nginx inside the frontend container. The server's main nginx (domains,
# HTTPS) passes every website request to this one, which serves dist/.

# Brand/category pages are pre-rendered per query string
# (/products?company=tynor -> _pre/products/company=tynor.html). Only plain
# slug=value pairs are allowed, so the query can't point outside that folder.
map $args $prerendered_query {
    "~^[a-z0-9_-]+=[a-z0-9_-]+(&[a-z0-9_-]+=[a-z0-9_-]+)*$" $args;
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the main nginx: send relative redirects, never this container's host/port
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # HTML changes on every deploy/re-render: browsers must re-check it
    add_header Cache-Control "no-cache";

    # /products/ -> /products, so each page has one address
    rewrite ^(.+)/$ $1 permanent;

    # Built JS/CSS have a content hash in their names and never change. A
    # missing one is a real 404, not the HTML page.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /products {
        try_files /_pre/products/$prerendered_query.html /products/index.html;
    }

    # The page's pre-rendered file if there is one, otherwise the app shell
    location / {
        try_files $uri $uri/index.html /_shell.html;
    }

    # Only reachable through the rules above
    location /_pre/ {
        internal;
    }
    location = /_shell.html {
        internal;
    }
}
