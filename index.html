<html lang="en">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Start downloading the loading-screen logo right away, before the app's JavaScript runs -->
    <link rel="preload" href="/muttrah_logo_480.webp" as="image" type="image/webp" fetchpriority="high" />
    <!--
      Fallback tags below, for visitors whose browser never runs the app's
      JavaScript: WhatsApp/Facebook/LinkedIn link previews, and search
      engines that only read the raw HTML. Once the app starts, the SEO
      component (src/components/SEO/SEO.jsx) removes every tag marked
      data-default="true" and replaces it with the correct one for the
      actual page, so a real visitor or Google never sees these instead.
    -->
    <title data-default="true">Muttrah Pharmacy | Medical &amp; Orthopedic Distributor in Oman</title>
    <meta data-default="true" name="description" content="Muttrah Pharmacy is a trusted pharmaceutical and orthopedic healthcare supplier in Muscat, Oman, serving clinics, hospitals, and pharmacies with quality medical products." />

    <meta property="og:type" data-default="true" content="website" />
    <meta property="og:site_name" content="Muttrah Pharmacy" />
    <meta property="og:title" data-default="true" content="Muttrah Pharmacy | Medical &amp; Orthopedic Distributor in Oman" />
    <meta property="og:description" data-default="true" content="Trusted pharmaceutical and orthopedic healthcare supplier in Muscat, Oman." />
    <meta property="og:url" data-default="true" content="https://muttrahpharmacy.com/" />
    <meta property="og:image" data-default="true" content="https://muttrahpharmacy.com/muttrah_logo_480.webp" />
    <meta name="twitter:card" data-default="true" content="summary_large_image" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
